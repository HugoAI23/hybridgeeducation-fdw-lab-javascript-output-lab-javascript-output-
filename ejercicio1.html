<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" <title>Manipulación del DOM</title>
</head>

<body>
    <p id="message"></p>
    <button onclick="escribirMensaje()">Actualizar Mensaje</button>
    <script>
        function escribirMensaje() {
            document.getElementById("message").innerHTML = "¡Texto actualizado con JavaScript!"
        }
    </script>

</body>

</html>
